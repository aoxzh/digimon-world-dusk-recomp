# Digimon World Dusk (USA, A6RE revision 0) runner settings.
# The runner refuses any other cartridge before applying these settings.

[game]
name = "Digimon World Dusk"
id = "A6RE"
region = "USA"
revision = 0
rom = "Digimon World - Dusk (USA).nds"
rom_size = 0x04000000
sha1 = "de1a1915e07288ffad654f3f9f2eb730a0fd1d9c"
sha256 = "df9522e07be99c5622e0211d3a50132776784db3fb28f42fc7392f588e1ae8cb"

[display]
# Top screen: map and dialogue. Bottom screen: touch UI.
screen_layout = "stacked"
supersampling = 1
antialiasing = 0

[system]
startup_mode = "automatic"

[cartridge]
# 64 KiB EEPROM; a save written by melonDS for this ROM is exactly 65536 bytes
# and loads correctly.
save_type = "eeprom"
save_size = 65536

[arm9]
rom_offset = 0x00004000
entry_pc = 0x02000800
load_address = 0x02000000
size = 0x00131098

[arm7]
rom_offset = 0x00280200
entry_pc = 0x02380000
load_address = 0x02380000
size = 0x000289C0
